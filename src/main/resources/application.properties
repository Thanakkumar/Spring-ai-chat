spring.application.name=spring-ai-integration
spring.ai.openai.api-key=<key>
spring.ai.openai.base-url=https://api.perplexity.ai
spring.ai.openai.chat.options.model=sonar
spring.ai.openai.chat.completions-path=/chat/completions
server.port=8085
logging.level.org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor=DEBUG